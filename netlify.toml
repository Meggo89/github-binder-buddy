[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Baseline security + crawl headers, applied to every response.
# Cache-Control is handled per path below (NOT here) so HTML shells re-fetch.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    # Per CSP spec, "*.example.com" matches subdomains only — NOT the bare
    # apex. GA4 occasionally routes through google-analytics.com and
    # googletagmanager.com apex hosts, so both apex and *.subdomain forms
    # are listed for every Google host below.
    Content-Security-Policy = "default-src 'self' https:; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://googletagmanager.com https://*.googletagmanager.com https://google-analytics.com https://*.google-analytics.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' https: data:; font-src 'self' data: https://fonts.gstatic.com; form-action 'self'; connect-src 'self' https://google-analytics.com https://*.google-analytics.com https://analytics.google.com https://*.analytics.google.com https://googletagmanager.com https://*.googletagmanager.com;"

# HTML shells must revalidate every time so deploys are picked up immediately.
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# The SPA fallback serves / as HTML; same rule.
[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Fingerprinted JS/CSS/images get long cache.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Sitemap and robots should refresh daily.
[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Cache-Control = "public, max-age=3600"

# Plain-text Markdown copies of key pages (written at build time by scripts/build-markdown.ts).
[[headers]]
  for = "/*.md"
  [headers.values]
    Content-Type = "text/markdown; charset=utf-8"
    Cache-Control = "public, max-age=0, must-revalidate"

# No catch-all redirect. Every page is prerendered to its own index.html, so an
# unknown URL gets dist/404.html with a real 404 status (Netlify serves 404.html
# automatically). A "/* /index.html 200" rule here would answer every unknown URL
# with the home page and a 200, which search engines treat as a soft 404.

[functions]
  # Bundle the notify-enquiry.mts function with esbuild so ESM + Node 20
  # fetch semantics work as written. Netlify auto-discovers files under
  # netlify/functions/, so the function is deployed on push to main.
  node_bundler = "esbuild"

[build.processing]
  skip_processing = false

[build.processing.html]
  pretty_urls = true

[build.processing.css]
  bundle = true
  minify = true

[build.processing.js]
  bundle = true
  minify = true

[build.processing.images]
  compress = true
